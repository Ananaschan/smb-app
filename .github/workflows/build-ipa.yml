name: Build IPA

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read
  actions: write

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v5.1.0

      - name: Install XcodeGen
        env:
          HOMEBREW_NO_REQUIRE_TAP_TRUST: "1"
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Install CocoaPods dependencies
        run: pod install

      - name: Build unsigned app for device
        run: |
          xcodebuild \
            -workspace SMBPlayer.xcworkspace \
            -scheme SMBPlayer \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath DerivedData \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO \
            build

      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -R "DerivedData/Build/Products/Release-iphoneos/SMBPlayer.app" "Payload/"
          FRAMEWORKS_DIR="Payload/SMBPlayer.app/Frameworks"
          mkdir -p "$FRAMEWORKS_DIR"
          AMSMB2_FRAMEWORK=$(find "DerivedData/Build/Products/Release-iphoneos" -maxdepth 3 -type d -name "AMSMB2.framework" -print -quit)
          if [ -z "$AMSMB2_FRAMEWORK" ]; then
            echo "::error::AMSMB2.framework not found in build products"
            exit 1
          fi
          if [ ! -d "$FRAMEWORKS_DIR/AMSMB2.framework" ]; then
            cp -R "$AMSMB2_FRAMEWORK" "$FRAMEWORKS_DIR/"
            echo "Embedded AMSMB2.framework"
          else
            echo "AMSMB2.framework already embedded"
          fi
          zip -qry SMBPlayer.ipa Payload

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v6.0.0
        with:
          name: SMBPlayer-unsigned
          path: SMBPlayer.ipa
